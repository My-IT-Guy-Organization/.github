# Canonical org label set. This is the source of truth; the label-sync
# workflow applies it to this repo, and other repos can copy this file +
# the workflow to stay consistent.
- name: bug
  color: d73a4a
  description: Something isn't working
- name: enhancement
  color: a2eeef
  description: New feature or request
- name: documentation
  color: 0075ca
  description: Docs, runbooks, and standards
- name: ci
  color: fbca04
  description: CI/CD, workflows, and automation
- name: dependencies
  color: 0366d6
  description: Dependency updates (Dependabot)
- name: security
  color: b60205
  description: Security-related work
- name: good first issue
  color: 7057ff
  description: Good for newcomers
- name: help wanted
  color: 008672
  description: Extra attention is needed
- name: question
  color: d876e3
  description: Further information is requested
- name: wontfix
  color: ffffff
  description: This will not be worked on
- name: duplicate
  color: cfd3d7
  description: This issue or PR already exists
